# Netlify Configuration File for Umas Community Rules Web 3.0+
[build]
  publish = "."
  command = ""

# Single Page Application SPA / Direct Asset Serving
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Performance Headers
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Access-Control-Allow-Origin = "*"
