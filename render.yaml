# Render Blueprint Configuration (Umas Community Rules Web)
services:
  # 1. Option A: Static Site (Identical to Netlify CDN)
  - type: web
    name: rules-web-static
    env: static
    buildCommand: echo "Build complete"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Option B: Node Web Service (Express API + Health Check)
  - type: web
    name: rules-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health